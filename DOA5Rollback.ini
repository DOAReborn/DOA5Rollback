[Rollback]
; 1 = on, 0 = off.
Enabled=1
; 1 = writes DOA5Rollback.log next to this file (no personal data).
Log=0
; Input delay: AUTO (from the ping) or 0 to 6 frames.
Delay=AUTO
; Max frames ahead of the opponent (1 to 8).
RollbackLimit=8
; Square in online rounds: green = rollback, orange = no prediction, purple = desync, red = game netcode.
Indicator=1
; 1 = top center, 0 = top left.
IndicatorPosition=1
; Height of the square (pixels, 1080p screen).
IndicatorHeight=62
; Size: 1 to 4.
IndicatorSize=1
; 1 = FRAMES / DESYNC text, 0 = number only.
IndicatorText=1
; EN or FR.
IndicatorLanguage=EN
; 1 = ping shown.
IndicatorPing=1

[ReplayTakeover]
; 1 = take control of a replay (offline only).
Enabled=1
; Button icons: PlayStation or Xbox.
PadStyle=PlayStation
